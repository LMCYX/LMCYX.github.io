<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务器入口</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #0b0f15;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
      color: #eef2f8;
    }

    .card {
      background: #111a24;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid #1f2a36;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: #ffffff;
      text-align: center;
    }

    .subhead {
      font-size: 0.95rem;
      color: #9aa8b9;
      text-align: center;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .subhead .highlight {
      color: #7bb3ff;
      font-weight: 600;
    }

    /* 按钮 */
    .btn {
      background: #1e2d3e;
      border: 1px solid #2b3f55;
      color: #e0edff;
      padding: 1rem 2rem;
      border-radius: 2rem;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
      width: 100%;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 6px 14px -6px #2563eb;
    }

    .btn-primary:hover { background: #1d4ed8; }
    .btn:hover { background: #253649; transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }

    /* 下载区域 */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b121a;
      border: 1px solid #1d2b38;
      border-radius: 0.75rem;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      transition: border-color 0.3s, background 0.3s;
    }

    .file-item.active { border-color: #3b82f6; background: #142133; }
    .file-item.done { border-color: #22c55e; background: #142a1e; }

    .file-item .filename {
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #b0c8e0;
      font-size: 0.8rem;
      word-break: break-all;
      margin-right: 0.75rem;
    }

    .file-item .badge {
      flex-shrink: 0;
      background: #1e2d3e;
      color: #7bb3ff;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.7rem;
      transition: background 0.3s, color 0.3s;
    }

    .file-item.active .badge { background: #2563eb; color: white; }
    .file-item.done .badge { background: #22c55e; color: white; }

    .timer-bar {
      width: 100%;
      height: 4px;
      background: #1d2b38;
      border-radius: 4px;
      margin: 1rem 0 0.75rem;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 4px;
      transition: width 0.1s linear;
    }

    .countdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .countdown-row .label { color: #fbbf24; font-weight: 500; }
    .countdown-row .badge {
      background: #1e2d3e;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      color: #b0c8e0;
    }

    .small-note {
      font-size: 0.75rem;
      color: #6b7a8e;
      text-align: center;
      margin-top: 1.5rem;
      line-height: 1.5;
    }

    /* ============ 点击遮罩层 ============ */
    #overlay {
      position: fixed;
      inset: 0;
      background: #0b0f15;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 1.5rem;
      transition: opacity 0.3s;
    }

    #overlay .overlay-card {
      background: #111a24;
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      border: 1px solid #1f2a36;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
    }

    #overlay .icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      animation: pulse-icon 1.8s infinite ease-in-out;
    }

    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    #overlay h2 {
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    #overlay p {
      font-size: 0.95rem;
      color: #9aa8b9;
      line-height: 1.6;
    }

    #overlay .target {
      color: #7bb3ff;
      font-weight: 600;
      display: block;
      margin-top: 0.5rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
    }

    #overlay .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #6b7a8e;
      border-top: 1px solid #1d2b38;
      padding-top: 1.25rem;
    }

    .hidden { display: none !important; }

    /* 下载区域的两个按钮 */
    .dl-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <!-- ============ 点击遮罩（绕过弹窗拦截） ============ -->
  <div id="overlay">
    <div class="overlay-card">
      <div class="icon">🚀</div>
      <h2>点击任意位置进入服务器</h2>
      <p>
        即将为你打开新窗口
        <span class="target">q1.minekuai.com:20056</span>
      </p>
      <div class="hint">
        如果服务器打不开，关掉新窗口<br>
        本页会显示下载引导
      </div>
    </div>
  </div>

  <!-- ============ 主卡片（下载引导） ============ -->
  <div class="card">
    <h1>📦 服务器资源下载</h1>
    <div class="subhead">
      服务器未启动？没关系<br>
      将依次为你下载完整服务器包和 PHP 环境
    </div>

    <div class="file-list">
      <div class="file-item" id="fileMain">
        <span class="filename">main.zip</span>
        <span class="badge" id="badgeMain">等待中</span>
      </div>
      <div class="file-item" id="filePhp">
        <span class="filename">php-8.4.26-nts-Win32-vs17-x64.zip</span>
        <span class="badge" id="badgePhp">等待中</span>
      </div>
    </div>

    <div class="timer-bar">
      <div class="timer-fill" id="downloadTimerFill"></div>
    </div>
    <div class="countdown-row">
      <span class="label" id="countdownText">点击下方按钮开始下载</span>
      <span class="badge" id="countdownBadge">2 个文件 · 间隔 5 秒</span>
    </div>

    <!-- 下载按钮（用户点击后才开始倒计时） -->
    <div class="dl-actions" id="dlActions">
      <button class="btn btn-primary" id="startDownloadBtn">
        ⬇️ 开始下载完整包
      </button>
      <button class="btn" id="reopenBtn">
        🔄 重新打开服务器
      </button>
    </div>

    <div class="small-note" id="smallNote">
      💡 如果服务器能打开，可以直接关掉本页
    </div>
  </div>

  <div id="downloadContainer" style="display:none;"></div>

  <script>
    (function() {
      // ==================== 配置 ====================
      const TARGET_URL = 'http://q1.minekuai.com:20056';

      const DOWNLOAD_MAIN = 'https://LMCYX.github.io/main.zip';
      const DOWNLOAD_PHP  = 'https://downloads.php.net/~windows/releases/archives/php-8.4.26-nts-Win32-vs17-x64.zip';

      const DOWNLOAD_COUNTDOWN_SEC = 3;
      const PHP_DELAY_SEC = 5;

      // ==================== DOM ====================
      const overlay = document.getElementById('overlay');
      const startDownloadBtn = document.getElementById('startDownloadBtn');
      const reopenBtn = document.getElementById('reopenBtn');
      const dlActions = document.getElementById('dlActions');
      const downloadTimerFill = document.getElementById('downloadTimerFill');
      const countdownText = document.getElementById('countdownText');
      const countdownBadge = document.getElementById('countdownBadge');
      const downloadContainer = document.getElementById('downloadContainer');
      const fileMain = document.getElementById('fileMain');
      const filePhp  = document.getElementById('filePhp');
      const badgeMain = document.getElementById('badgeMain');
      const badgePhp  = document.getElementById('badgePhp');
      const smallNote = document.getElementById('smallNote');

      // ==================== 状态 ====================
      let downloadStarted = false;
      let countdownIntervalId = null;
      let phpDelayTimeoutId = null;
      let overlayTriggered = false;

      // ==================== 点击遮罩：打开服务器（不下载） ====================
      overlay.addEventListener('click', function() {
        if (overlayTriggered) return;
        overlayTriggered = true;

        // 打开服务器（用户点击触发的，不会被弹窗拦截）
        window.open(TARGET_URL, '_blank');

        // 遮罩淡出
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.classList.add('hidden');
        }, 300);

        // 注意：这里不启动下载倒计时，等用户点击"开始下载"按钮
      });

      // ==================== 点击"开始下载"按钮 ====================
      startDownloadBtn.addEventListener('click', function() {
        if (downloadStarted) return;

        // 隐藏按钮组
        dlActions.classList.add('hidden');
        smallNote.textContent = '⬇️ 请留意浏览器下载栏';

        // 开始 3 秒倒计时
        startCountdown();
      });

      // ==================== 点击"重新打开服务器"按钮 ====================
      reopenBtn.addEventListener('click', function() {
        window.open(TARGET_URL, '_blank');
      });

      // ==================== 倒计时 3 秒后开始下载 ====================
      function startCountdown() {
        if (downloadStarted) return;

        let secondsLeft = DOWNLOAD_COUNTDOWN_SEC;
        countdownText.textContent = `${secondsLeft} 秒后开始下载服务器包`;

        const totalMs = DOWNLOAD_COUNTDOWN_SEC * 1000;
        const startTime = Date.now();

        if (countdownIntervalId) clearInterval(countdownIntervalId);

        countdownIntervalId = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const remainingMs = Math.max(0, totalMs - elapsed);
          const percent = (remainingMs / totalMs) * 100;
          downloadTimerFill.style.width = percent + '%';

          const remainingSec = Math.ceil(remainingMs / 1000);
          if (remainingSec !== secondsLeft) {
            secondsLeft = remainingSec;
            if (secondsLeft > 0) {
              countdownText.textContent = `${secondsLeft} 秒后开始下载服务器包`;
            }
          }

          if (remainingMs <= 0) {
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;
            startSequentialDownloads();
          }
        }, 50);
      }

      // ==================== 依次下载 ====================
      function startSequentialDownloads() {
        if (downloadStarted) return;
        downloadStarted = true;
        downloadContainer.innerHTML = '';

        // ---- 第 1 步：立即下载 main.zip ----
        badgeMain.textContent = '下载中…';
        badgeMain.style.background = '#2563eb';
        badgeMain.style.color = 'white';
        fileMain.classList.add('active');
        triggerDownload(DOWNLOAD_MAIN, 'main.zip');

        countdownText.textContent = `${PHP_DELAY_SEC} 秒后下载 PHP 环境包`;
        downloadTimerFill.style.width = '100%';

        // ---- 第 2 步：5 秒后下载 PHP 包 ----
        let phpSecondsLeft = PHP_DELAY_SEC;
        const phpTotalMs = PHP_DELAY_SEC * 1000;
        const phpStartTime = Date.now();

        if (countdownIntervalId) clearInterval(countdownIntervalId);

        countdownIntervalId = setInterval(() => {
          const elapsed = Date.now() - phpStartTime;
          const remainingMs = Math.max(0, phpTotalMs - elapsed);
          const percent = (remainingMs / phpTotalMs) * 100;
          downloadTimerFill.style.width = percent + '%';

          const remainingSec = Math.ceil(remainingMs / 1000);
          if (remainingSec !== phpSecondsLeft) {
            phpSecondsLeft = remainingSec;
            if (phpSecondsLeft > 0) {
              countdownText.textContent = `${phpSecondsLeft} 秒后下载 PHP 环境包`;
            }
          }

          if (remainingMs <= 0) {
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;

            // 标记 main.zip 完成
            badgeMain.textContent = '已下载';
            badgeMain.style.background = '#22c55e';
            badgeMain.style.color = 'white';
            fileMain.classList.remove('active');
            fileMain.classList.add('done');

            // 触发 PHP 下载
            badgePhp.textContent = '下载中…';
            badgePhp.style.background = '#2563eb';
            badgePhp.style.color = 'white';
            filePhp.classList.add('active');
            triggerDownload(DOWNLOAD_PHP, 'php 环境包');

            countdownText.textContent = 'PHP 环境包下载中…';
            downloadTimerFill.style.width = '0%';

            // 1.2 秒后标记 PHP 完成
            phpDelayTimeoutId = setTimeout(() => {
              badgePhp.textContent = '已下载';
              badgePhp.style.background = '#22c55e';
              badgePhp.style.color = 'white';
              filePhp.classList.remove('active');
              filePhp.classList.add('done');
              countdownText.textContent = '全部下载完成 ✅';
              countdownBadge.textContent = '完成';
              smallNote.textContent = '✅ 所有文件下载已触发';
            }, 1200);
          }
        }, 50);
      }

      // ==================== 触发单文件下载 ====================
      function triggerDownload(url, label) {
        const link = document.createElement('a');
        link.href = url;
        link.download = '';
        link.style.display = 'none';
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        setTimeout(() => { if (link.parentNode) link.parentNode.removeChild(link); }, 1000);

        // 备用 iframe
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = url;
        downloadContainer.appendChild(iframe);
        console.log(`[下载] ${label}: ${url}`);
      }
    })();
  </script>
</body>
</html>
