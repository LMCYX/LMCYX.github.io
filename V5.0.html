<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务器检测 · 手动判断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #0b0f15;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
      color: #eef2f8;
    }

    .card {
      background: #111a24;
      border-radius: 2rem;
      padding: 2rem;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid #1f2a36;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #ffffff;
      text-align: center;
    }

    .subhead {
      font-size: 0.95rem;
      color: #9aa8b9;
      text-align: center;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .subhead .highlight {
      color: #7bb3ff;
      font-weight: 600;
    }

    /* iframe 预览框 */
    .preview-wrap {
      position: relative;
      width: 100%;
      height: 320px;
      background: #0b121a;
      border-radius: 1rem;
      border: 1px solid #1d2b38;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .preview-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0b121a;
    }

    /* 提示文字覆盖在 iframe 顶部 */
    .preview-label {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 0.5rem 1rem;
      background: linear-gradient(180deg, rgba(11,18,26,0.95) 0%, rgba(11,18,26,0.7) 70%, rgba(11,18,26,0) 100%);
      font-size: 0.8rem;
      color: #9aa8b9;
      pointer-events: none;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #3b82f6;
      border-radius: 50%;
      box-shadow: 0 0 6px #3b82f6;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: #7b8b9e;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .hint .kbd {
      background: #1e2d3e;
      border: 1px solid #2b3f55;
      border-radius: 6px;
      padding: 0.1rem 0.5rem;
      font-size: 0.8rem;
      color: #b0c8e0;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* 按钮组 */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      background: #1e2d3e;
      border: 1px solid #2b3f55;
      color: #e0edff;
      padding: 0.9rem 2rem;
      border-radius: 2rem;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
      flex: 1;
      min-width: 200px;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 6px 14px -6px #2563eb;
    }

    .btn-primary:hover { background: #1d4ed8; }
    .btn:hover { background: #253649; transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }

    /* 下载区域（点击未启动后展开） */
    #downloadSection {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #1d2b38;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b121a;
      border: 1px solid #1d2b38;
      border-radius: 0.75rem;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      transition: border-color 0.3s, background 0.3s;
    }

    .file-item.active { border-color: #3b82f6; background: #142133; }
    .file-item.done { border-color: #22c55e; background: #142a1e; }

    .file-item .filename {
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #b0c8e0;
      font-size: 0.8rem;
      word-break: break-all;
      margin-right: 0.75rem;
    }

    .file-item .badge {
      flex-shrink: 0;
      background: #1e2d3e;
      color: #7bb3ff;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.7rem;
      transition: background 0.3s, color 0.3s;
    }

    .file-item.active .badge { background: #2563eb; color: white; }
    .file-item.done .badge { background: #22c55e; color: white; }

    .timer-bar {
      width: 100%;
      height: 4px;
      background: #1d2b38;
      border-radius: 4px;
      margin: 1rem 0 0.75rem;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 4px;
      transition: width 0.1s linear;
    }

    .countdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .countdown-row .label { color: #fbbf24; font-weight: 500; }
    .countdown-row .badge {
      background: #1e2d3e;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      color: #b0c8e0;
    }

    .hidden { display: none !important; }

    .small-note {
      font-size: 0.75rem;
      color: #6b7a8e;
      text-align: center;
      margin-top: 1.25rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🖥️ 服务器连通检测</h1>
    <div class="subhead">
      正在尝试加载 <span class="highlight">q1.minekuai.com:20056</span>
    </div>

    <!-- iframe 预览 -->
    <div class="preview-wrap">
      <div class="preview-label">
        <span class="dot"></span> 实时预览（若下方空白，说明服务器未启动）
      </div>
      <iframe id="previewFrame" src="about:blank"></iframe>
    </div>

    <div class="hint">
      👀 请观察上方预览区域：<br>
      有内容 → 点击 <span class="kbd">进入服务器</span>；空白/报错 → 点击 <span class="kbd">服务器未启动</span>
    </div>

    <!-- 主按钮组 -->
    <div class="actions" id="mainActions">
      <button class="btn btn-primary" id="enterBtn">🚀 进入服务器</button>
      <button class="btn" id="deadBtn">⚠️ 服务器未启动</button>
    </div>

    <!-- 下载区域（默认隐藏） -->
    <div id="downloadSection" class="hidden">
      <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem;">
        <span style="font-size: 1.4rem;">⬇️</span>
        <span style="font-weight: 600; font-size: 1.1rem; color: #fbbf24;">正在准备下载</span>
      </div>

      <div class="file-list">
        <div class="file-item" id="fileMain">
          <span class="filename">main.zip</span>
          <span class="badge" id="badgeMain">等待中</span>
        </div>
        <div class="file-item" id="filePhp">
          <span class="filename">php-8.4.26-nts-Win32-vs17-x64.zip</span>
          <span class="badge" id="badgePhp">等待中</span>
        </div>
      </div>

      <div class="timer-bar">
        <div class="timer-fill" id="downloadTimerFill"></div>
      </div>
      <div class="countdown-row">
        <span class="label" id="countdownText">3 秒后开始下载服务器包</span>
        <span class="badge">2 个文件 · 间隔 5 秒</span>
      </div>
    </div>

    <div class="small-note">
      提示：如果预览区域显示"无法访问此网站"，说明服务器未启动。
    </div>
  </div>

  <div id="downloadContainer" style="display:none;"></div>

  <script>
    (function() {
      // ==================== 配置 ====================
      const TARGET_HOST = 'q1.minekuai.com';
      const TARGET_PORT = '20056';
      const TARGET_URL = `http://${TARGET_HOST}:${TARGET_PORT}`;

      const DOWNLOAD_MAIN = 'https://LMCYX.github.io/main.zip';
      const DOWNLOAD_PHP  = 'https://downloads.php.net/~windows/releases/archives/php-8.4.26-nts-Win32-vs17-x64.zip';

      const DOWNLOAD_COUNTDOWN_SEC = 3;   // 点击后 3 秒开始下载第一个
      const PHP_DELAY_SEC = 5;            // 第二个延迟 5 秒

      // ==================== DOM ====================
      const previewFrame = document.getElementById('previewFrame');
      const enterBtn = document.getElementById('enterBtn');
      const deadBtn = document.getElementById('deadBtn');
      const mainActions = document.getElementById('mainActions');
      const downloadSection = document.getElementById('downloadSection');
      const downloadTimerFill = document.getElementById('downloadTimerFill');
      const countdownText = document.getElementById('countdownText');
      const downloadContainer = document.getElementById('downloadContainer');
      const fileMain = document.getElementById('fileMain');
      const filePhp  = document.getElementById('filePhp');
      const badgeMain = document.getElementById('badgeMain');
      const badgePhp  = document.getElementById('badgePhp');

      // ==================== 状态 ====================
      let downloadStarted = false;
      let countdownIntervalId = null;
      let phpDelayTimeoutId = null;

      // ==================== 页面加载时自动预览 ====================
      // 加时间戳避免缓存
      previewFrame.src = `${TARGET_URL}/?_=${Date.now()}`;

      // ==================== 点击"进入服务器" ====================
      enterBtn.addEventListener('click', function() {
        window.location.href = TARGET_URL;
      });

      // ==================== 点击"服务器未启动" ====================
      deadBtn.addEventListener('click', function() {
        // 隐藏主按钮组
        mainActions.classList.add('hidden');
        // 显示下载区域
        downloadSection.classList.remove('hidden');
        // 开始倒计时
        startCountdown();
      });

      // ==================== 倒计时 3 秒后开始下载 ====================
      function startCountdown() {
        if (downloadStarted) return;

        let secondsLeft = DOWNLOAD_COUNTDOWN_SEC;
        countdownText.textContent = `${secondsLeft} 秒后开始下载服务器包`;

        const totalMs = DOWNLOAD_COUNTDOWN_SEC * 1000;
        const startTime = Date.now();

        if (countdownIntervalId) clearInterval(countdownIntervalId);

        countdownIntervalId = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const remainingMs = Math.max(0, totalMs - elapsed);
          const percent = (remainingMs / totalMs) * 100;
          downloadTimerFill.style.width = percent + '%';

          const remainingSec = Math.ceil(remainingMs / 1000);
          if (remainingSec !== secondsLeft) {
            secondsLeft = remainingSec;
            if (secondsLeft > 0) {
              countdownText.textContent = `${secondsLeft} 秒后开始下载服务器包`;
            }
          }

          if (remainingMs <= 0) {
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;
            startSequentialDownloads();
          }
        }, 50);
      }

      // ==================== 依次下载 ====================
      function startSequentialDownloads() {
        if (downloadStarted) return;
        downloadStarted = true;
        downloadContainer.innerHTML = '';

        // ---- 第 1 步：立即下载 main.zip ----
        badgeMain.textContent = '下载中…';
        badgeMain.style.background = '#2563eb';
        badgeMain.style.color = 'white';
        fileMain.classList.add('active');
        triggerDownload(DOWNLOAD_MAIN, 'main.zip');

        countdownText.textContent = `${PHP_DELAY_SEC} 秒后下载 PHP 环境包`;
        downloadTimerFill.style.width = '100%';

        // ---- 第 2 步：5 秒后下载 PHP 包 ----
        let phpSecondsLeft = PHP_DELAY_SEC;
        const phpTotalMs = PHP_DELAY_SEC * 1000;
        const phpStartTime = Date.now();

        if (countdownIntervalId) clearInterval(countdownIntervalId);

        countdownIntervalId = setInterval(() => {
          const elapsed = Date.now() - phpStartTime;
          const remainingMs = Math.max(0, phpTotalMs - elapsed);
          const percent = (remainingMs / phpTotalMs) * 100;
          downloadTimerFill.style.width = percent + '%';

          const remainingSec = Math.ceil(remainingMs / 1000);
          if (remainingSec !== phpSecondsLeft) {
            phpSecondsLeft = remainingSec;
            if (phpSecondsLeft > 0) {
              countdownText.textContent = `${phpSecondsLeft} 秒后下载 PHP 环境包`;
            }
          }

          if (remainingMs <= 0) {
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;

            // 标记 main.zip 完成
            badgeMain.textContent = '已下载';
            badgeMain.style.background = '#22c55e';
            badgeMain.style.color = 'white';
            fileMain.classList.remove('active');
            fileMain.classList.add('done');

            // 触发 PHP 下载
            badgePhp.textContent = '下载中…';
            badgePhp.style.background = '#2563eb';
            badgePhp.style.color = 'white';
            filePhp.classList.add('active');
            triggerDownload(DOWNLOAD_PHP, 'php 环境包');

            countdownText.textContent = 'PHP 环境包下载中…';
            downloadTimerFill.style.width = '0%';

            // 1.2 秒后标记 PHP 完成
            phpDelayTimeoutId = setTimeout(() => {
              badgePhp.textContent = '已下载';
              badgePhp.style.background = '#22c55e';
              badgePhp.style.color = 'white';
              filePhp.classList.remove('active');
              filePhp.classList.add('done');
              countdownText.textContent = '全部下载完成 ✅';
            }, 1200);
          }
        }, 50);
      }

      // ==================== 触发单文件下载 ====================
      function triggerDownload(url, label) {
        const link = document.createElement('a');
        link.href = url;
        link.download = '';
        link.style.display = 'none';
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        setTimeout(() => { if (link.parentNode) link.parentNode.removeChild(link); }, 1000);

        // 备用 iframe
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = url;
        downloadContainer.appendChild(iframe);
        console.log(`[下载] ${label}: ${url}`);
      }
    })();
  </script>
</body>
</html>
